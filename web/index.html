<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/app.css"><title>投资决策质量 MVP</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1020; --panel:#121a2f; --line:#263250; --text:#edf2ff; --muted:#9aa8c7; --accent:#7c9cff; --good:#52d6a1; --warn:#ffcc66; }
    * { box-sizing:border-box; } body { margin:0; background:linear-gradient(135deg,#0b1020,#111a31); color:var(--text); font:15px/1.5 Inter,Segoe UI,sans-serif; }
    .shell { max-width:1120px; margin:0 auto; padding:34px 20px 60px; } header { display:flex; justify-content:space-between; align-items:end; gap:20px; margin-bottom:24px; }
    h1,h2,h3,p { margin-top:0; } h1 { font-size:30px; margin-bottom:6px; } h2 { font-size:21px; letter-spacing:-.3px; } .sub,.muted { color:var(--muted); } .section-kicker{font:11px ui-monospace,monospace;letter-spacing:1.8px;color:#93a8d7;margin-bottom:8px}.section-intro{line-height:1.6;margin-bottom:20px}.research-panel{border-top:4px solid #7e9cff;background:linear-gradient(145deg,#17284a,#10182c);box-shadow:0 18px 45px #526fd522}.decision-panel{border-top:4px solid #52d6a1;background:linear-gradient(145deg,#142f34,#10182c);box-shadow:0 18px 45px #42c89e1c}.decision-panel h2{color:#b8f1d7}.research-panel h2{color:#c5d2ff}.decision-panel .section-kicker{color:#77e0b7}.decision-panel .notice{border-color:#2d6259;background:#12302f}.research-panel .detail{border-left:3px solid #7e9cff;padding-left:12px}.decision-panel .card{border-left:3px solid #52d6a1;background:#112529}.decision-panel .card-top{align-items:flex-start}.decision-panel #summary{font-size:13px}.research-panel .actions{margin-top:16px}
    .grid { display:grid; grid-template-columns:360px 1fr; gap:18px; } .panel { background:rgba(18,26,47,.92); border:1px solid var(--line); border-radius:16px; padding:20px; box-shadow:0 15px 35px #05081155; }
    label { display:block; color:var(--muted); margin:14px 0 6px; } input,select,textarea { width:100%; background:#0c1326; color:var(--text); border:1px solid var(--line); border-radius:9px; padding:10px 11px; font:inherit; } textarea { min-height:100px; resize:vertical; }
    button { border:0; border-radius:9px; padding:10px 14px; color:#081020; background:var(--accent); font-weight:700; cursor:pointer; } button.secondary { background:#253252; color:var(--text); } button.danger { background:#69364a; color:#fff; } .actions { display:flex; gap:8px; margin-top:18px; flex-wrap:wrap; }
    .cards { display:grid; gap:12px; } .card { border:1px solid var(--line); border-radius:12px; padding:15px; background:#0e162a; } .card-top { display:flex; justify-content:space-between; gap:12px; } .symbol { font-weight:800; font-size:18px; } .pill { border-radius:999px; padding:3px 9px; font-size:12px; background:#26365d; color:#dce5ff; } .pill.open { color:var(--warn); } .pill.reviewed { color:var(--good); }
    .detail { margin-top:15px; border-top:1px solid var(--line); padding-top:14px; } ul { margin:7px 0 0 18px; padding:0; } li { margin:5px 0; } .empty { padding:30px 10px; text-align:center; color:var(--muted); }
    .notice { background:#182542; border:1px solid #2f4674; color:#cbd8fa; padding:12px 14px; border-radius:10px; margin-bottom:18px; }
    @media(max-width:800px){ .grid{grid-template-columns:1fr;} header{display:block;} }
  </style>
</head>
<body>
  <main class="shell">
    <header><div><h1>投资研究</h1><p class="sub">把“我觉得会涨”变成可复查的投资假设。</p></div><span class="pill">研究、记录与复查</span></header>
    <div class="notice">当前版本只保存你的投资研究记录，不接入实时行情，也不会真实下单。数据保存在浏览器本地。</div>
    <section class="grid">
      <form class="panel research-panel" id="card-form">
        <div class="section-kicker">01 · AGENT RESEARCH</div><h2>研究工作台</h2><p class="sub section-intro">输入标的和你的判断，让 Agent 拆解事实、反方证据与风险。</p>
        <label for="symbol">A 股代码</label><input id="symbol" required placeholder="例如 600519" /><div id="market" class="muted" style="margin-top:8px">输入代码后会尝试读取本地服务的行情。</div><div id="history" class="muted" style="margin-top:8px"></div><div class="actions"><button type="button" class="secondary" id="research">生成研究快照</button></div><div id="report" class="detail"></div>
        <label for="action">计划</label><select id="action"><option value="buy">买入</option><option value="sell">卖出</option><option value="watch">观察</option></select>
        <label for="reason">你的理由</label><textarea id="reason" required placeholder="例如：订单增长，未来利润可能改善"></textarea>
        <label for="horizon">持有周期</label><select id="horizon"><option value="short">短期</option><option value="medium" selected>中期</option><option value="long">长期</option></select>
        <label for="max-loss">最大可接受亏损（%）</label><input id="max-loss" type="number" min="0.1" max="100" step="0.1" placeholder="例如 10" />
        <label for="review-days">几天后复查</label><input id="review-days" type="number" min="1" value="7" />
        <label for="entry-price">模拟价格（可选）</label><input id="entry-price" type="number" min="0" step="0.0001" placeholder="例如 150" />
        <label for="quantity">模拟数量（可选）</label><input id="quantity" type="number" min="0" step="0.0001" placeholder="例如 100" />
        <div class="actions"><button>保存研究记录</button><button type="button" class="secondary" id="agent">让 Agent 分析</button><button type="button" class="secondary" id="demo">填入示例</button></div><div id="agent-result" class="detail"></div>
      </form>
      <section class="panel decision-panel"><div class="section-kicker">02 · RESEARCH RECORDS</div><div class="card-top"><div><h2>研究记录</h2><p class="sub section-intro">保存研究判断、仓位和失效条件，并在同一处完成复查。</p></div><div class="actions"><button class="secondary" id="export">导出</button><button class="secondary" id="import">导入</button><button class="secondary" id="clear">清空本地数据</button></div></div><div id="summary" class="notice"></div><div class="actions"><button class="secondary" id="evaluation">刷新后端评测</button></div><div id="evaluation-result" class="muted"></div><label for="filter">筛选</label><select id="filter"><option value="all">全部</option><option value="open">待复查</option><option value="reviewed">已复查</option></select><input id="file" type="file" accept="application/json" hidden /><div id="cards" class="cards"></div></section>
    </section>
  </main>
  <script>
    const key='investment_decision_cards_v1';
    const $=id=>document.getElementById(id);
    const load=()=>JSON.parse(localStorage.getItem(key)||'[]');
    const save=cards=>{localStorage.setItem(key,JSON.stringify(cards)); if(location.protocol.startsWith('http')) cards.forEach(card=>fetch('/api/decisions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(card)}).catch(()=>{}));};
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function render(){ const all=load(); const open=all.filter(c=>c.status==='open').length; const reviewed=all.filter(c=>c.status==='reviewed'); const pnl=reviewed.reduce((sum,c)=>sum+(c.entryPrice&&c.quantity&&c.currentPrice?(c.action==='sell'?c.entryPrice-c.currentPrice:c.currentPrice-c.entryPrice)*c.quantity:0),0); $('summary').textContent=`总研究记录 ${all.length} · 待复查 ${open} · 已复查 ${reviewed.length} · 已记录模拟盈亏 ${pnl.toFixed(2)}`; const filter=$('filter').value; const cards=filter==='all'?all:all.filter(c=>c.status===filter); const root=$('cards'); if(!cards.length){root.innerHTML='<div class="empty">没有符合条件的研究记录。</div>';return;} const today=new Date(); root.innerHTML=cards.map(c=>{const due=new Date(c.reviewAt+' 23:59:59')<=today && c.status==='open'; const paper=c.entryPrice&&c.quantity?`<p class="muted">模拟仓位：${esc(c.quantity)} × ${esc(c.entryPrice)} = ${esc((c.entryPrice*c.quantity).toFixed(2))}${c.currentPrice?` · 当前价 ${esc(c.currentPrice)} · 模拟盈亏 ${esc(((c.action==='sell'?c.entryPrice-c.currentPrice:c.currentPrice-c.entryPrice)*c.quantity).toFixed(2))}`:''}</p>`:''; return `<article class="card"><div class="card-top"><div><div class="symbol">${esc(c.symbol)}</div><div class="muted">${esc(c.action)} · ${esc(c.horizon)} · 创建于 ${esc(c.createdAt)}</div></div><span class="pill ${c.status}">${due?'到期待复查':c.status==='open'?'待复查':'已复查'}</span></div><p><b>原始理由：</b>${esc(c.reason)}</p>${paper}<div class="detail"><b>系统提示</b><ul>${c.prompts.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="muted">复查日期：${esc(c.reviewAt)}${c.maxLoss?` · 最大亏损：${esc(c.maxLoss)}%`:''}</p>${c.status==='open'?`<div class="actions"><button data-review="${c.id}">完成复查</button><button class="danger" data-delete="${c.id}">删除</button></div>`:`<p><b>复查记录：</b>${esc(c.reviewNote)}</p>`}</div></article>`}).join(''); }
    let latestQuote=null;
    let latestAnalysis=null;
    async function loadQuote(){ const symbol=$('symbol').value.trim(); if(!symbol)return; $('market').textContent='正在读取 A 股行情…'; $('history').textContent=''; try{ const response=await fetch(`/api/quote?symbol=${encodeURIComponent(symbol)}`); const data=await response.json(); if(!response.ok||data.error)throw new Error(data.error||'行情读取失败'); latestQuote=data; $('market').textContent=`${data.f58} · 当前价 ${(Number(data.f43)/100).toFixed(2)} · 涨跌幅 ${(Number(data.f170)/100).toFixed(2)}% · 成交量 ${data.f47}`; if(!$('entry-price').value&&data.f43)$('entry-price').value=(Number(data.f43)/100).toFixed(2); const historyResponse=await fetch(`/api/history?symbol=${encodeURIComponent(symbol)}`); const historyData=await historyResponse.json(); if(historyData.klines?.length){ const rows=historyData.klines.slice(-60).map(row=>{const parts=String(row).split(',');return {date:parts[0],close:Number(parts[2]||parts[4])};}).filter(row=>Number.isFinite(row.close)); const first=rows[0]?.close,last=rows.at(-1)?.close; let peak=0,maxDrawdown=0; for(const row of rows){peak=Math.max(peak,row.close);if(peak)maxDrawdown=Math.min(maxDrawdown,(row.close/peak-1)*100);} const change=first?((last/first-1)*100):0; $('history').textContent=`近 ${rows.length} 个交易日：${change.toFixed(2)}% · 最大回撤 ${maxDrawdown.toFixed(2)}%`; } }catch(error){latestQuote=null;$('market').textContent=`行情读取失败：${error.message}。请确认使用 http://localhost:8788`;}}
    $('symbol').addEventListener('blur',loadQuote);
    $('research').addEventListener('click',async()=>{const symbol=$('symbol').value.trim();if(!symbol)return;const report=$('report');report.textContent='正在生成研究快照…';try{const [research,financials,announcements]=await Promise.all([fetch(`/api/research?symbol=${encodeURIComponent(symbol)}`).then(r=>r.json()),fetch(`/api/financials?symbol=${encodeURIComponent(symbol)}`).then(r=>r.json()),fetch(`/api/announcements?symbol=${encodeURIComponent(symbol)}`).then(r=>r.json())]);const metrics=research.metrics||{};const quote=research.quote||{};const latest=(financials.items||[])[0];report.innerHTML=`<b>${esc(quote.f58||symbol)} 研究快照</b><ul><li>当前价格：${esc((Number(quote.f43||0)/100).toFixed(2))}</li><li>近60日涨跌：${metrics.changePct==null?'暂无':metrics.changePct.toFixed(2)+'%'}</li><li>近60日最大回撤：${metrics.maxDrawdownPct==null?'暂无':metrics.maxDrawdownPct.toFixed(2)+'%'}</li>${latest?`<li>最新财报期：${esc(latest[2]||'')}</li><li>净利润：${esc(latest[5]??'暂无')}</li><li>ROE：${esc(latest[7]??'暂无')}</li>`:'<li>财报：未配置 Tushare Token</li>'}<li>公告数量：${esc((announcements.items||[]).length)}</li></ul>`;}catch(error){report.textContent='研究快照生成失败：'+error.message;}});
    $('agent').addEventListener('click',async()=>{const symbol=$('symbol').value.trim();const reason=$('reason').value.trim();const target=$('agent-result');if(!symbol||!reason){target.textContent='请先输入股票代码和交易理由。';return;}target.textContent='Agent 正在分析…';try{const response=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({symbol,reason})});const data=await response.json();if(!response.ok)throw new Error(data.error||'分析失败');latestAnalysis={provider:data.provider,model:data.model,analysis:data.analysis};const a=data.analysis;const sections=[['事实','facts'],['推断','inferences'],['反方证据','counter_arguments'],['风险','risks'],['判断失效条件','invalidation_conditions'],['下一步检查','next_checks']];target.innerHTML=`<b>Agent 研究结论 · ${esc(data.provider||'llm')} / ${esc(data.model||'')}</b>`+sections.map(([title,key])=>{const items=Array.isArray(a?.[key])?a[key]:[];return `<div class="detail"><b>${title}</b>${items.length?`<ul>${items.map(item=>`<li>${esc(item)}</li>`).join('')}</ul>`:'<p class="muted">暂无结构化结果</p>'}</div>`}).join('');}catch(error){latestAnalysis=null;target.textContent='Agent 分析失败：'+error.message;}});
    $('card-form').addEventListener('submit',()=>{setTimeout(()=>{if(!latestAnalysis)return;const cards=load();if(!cards.length)return;cards[0].agentAnalysis=latestAnalysis;save(cards);render();},0);});
    $('card-form').addEventListener('submit',e=>{e.preventDefault(); const reason=$('reason').value.trim(); const reviewDays=Number($('review-days').value); const lower=reason.toLowerCase(); const prompts=['原始理由可能已经被市场价格反映','当前版本没有接入财报和公告验证，请补充证据后再形成结论','将最大亏损和仓位一起考虑，不要把研究结论当成收益保证']; if(latestQuote)prompts.unshift(`创建时行情：${latestQuote.f58}，价格 ${latestQuote.f43}`); if(lower.includes('订单')) prompts.push('复查订单金额或订单增速是否继续上升'); if(lower.includes('利润')||lower.includes('业绩')) prompts.push('复查下一次财报中的收入、利润和现金流'); if(lower.includes('估值')) prompts.push('便宜可能反映业务质量或增长风险'); const now=new Date(); const review=new Date(now.getTime()+reviewDays*86400000); const cards=load(); cards.unshift({id:crypto.randomUUID(),symbol:$('symbol').value.trim().toUpperCase(),action:$('action').value,horizon:$('horizon').value,reason,maxLoss:$('max-loss').value,entryPrice:Number($('entry-price').value)||null,quantity:Number($('quantity').value)||null,createdAt:now.toLocaleString(),reviewAt:review.toLocaleDateString(),prompts,status:'open'}); save(cards); e.target.reset(); $('review-days').value=7; latestQuote=null; $('market').textContent='输入代码后会尝试读取本地服务的行情。'; render();});
    $('demo').addEventListener('click',()=>{$('symbol').value='600519';$('action').value='buy';$('reason').value='订单增长，未来利润可能改善';$('horizon').value='medium';$('max-loss').value=10;$('review-days').value=7;});
    $('clear').addEventListener('click',()=>{if(confirm('确认清空浏览器中的全部研究记录？')){localStorage.removeItem(key);render();}});
    $('filter').addEventListener('change',render);
    $('evaluation').addEventListener('click',async()=>{const target=$('evaluation-result');target.textContent='正在读取后端评测…';try{const response=await fetch('/api/evaluation');const data=await response.json();target.textContent=`后端评测：总计 ${data.total} · 待复查 ${data.open} · 已复查 ${data.reviewed} · 逻辑兑现 ${data.valid} · 逻辑失效 ${data.invalid} · 模拟盈亏 ${Number(data.simulatedPnl).toFixed(2)}`;}catch(error){target.textContent='后端评测暂不可用，请确认使用本地服务地址。';}});
    $('export').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(load(),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='investment-decision-cards.json';a.click();URL.revokeObjectURL(a.href);});
    $('import').addEventListener('click',()=>$('file').click());
    $('file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const imported=JSON.parse(await file.text());if(!Array.isArray(imported))throw new Error('格式错误');save([...imported,...load()]);render();}catch(error){alert('导入失败：'+error.message)}e.target.value='';});
    $('cards').addEventListener('click',e=>{const review=e.target.dataset.review; const del=e.target.dataset.delete; const cards=load(); if(review){const c=cards.find(x=>x.id===review);const outcome=prompt('判断结果：输入 valid=逻辑兑现，invalid=逻辑失效，uncertain=暂不确定');if(outcome&&['valid','invalid','uncertain'].includes(outcome)){const note=prompt('这次复查发生了什么？');if(note){const current=prompt(c.entryPrice&&c.quantity?'请输入当前价格，用于计算模拟盈亏。留空则跳过。':'请输入复查时的当前价格（可留空）。');c.status='reviewed';c.outcome=outcome;c.reviewNote=note;if(current&&Number(current)>0)c.currentPrice=Number(current);save(cards);render();}}} if(del){save(cards.filter(x=>x.id!==del));render();}}); render();
  </script>
</body>
</html>
