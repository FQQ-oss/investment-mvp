<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/app.css"><title>模拟交易 - 投资学习系统</title><style>body{margin:0;background:#0b1020;color:#edf2ff;font:15px Segoe UI,sans-serif}.layout{display:flex;min-height:100vh}.side{width:230px;background:#10182b;border-right:1px solid #263250;padding:24px}.side h1{font-size:20px}.nav{display:block;color:#b6c2df;text-decoration:none;padding:11px;border-radius:8px;margin:6px 0}.nav:hover,.nav.active{background:#24365e;color:#fff}.main{max-width:1100px;padding:34px;flex:1}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat,.panel{background:#121a2f;border:1px solid #263250;border-radius:12px;padding:18px}.stat b{font-size:22px;display:block;margin-top:8px}.panel{margin-top:18px}input,select{background:#0c1326;color:#fff;border:1px solid #263250;border-radius:8px;padding:10px;margin:5px;width:160px}button{padding:10px 14px;border:0;border-radius:8px;font-weight:700;margin:5px;background:#7c9cff}.muted{color:#9aa8c7}table{width:100%;border-collapse:collapse;margin-top:10px}td,th{text-align:left;border-bottom:1px solid #263250;padding:10px}@media(max-width:750px){.side{width:170px}.main{padding:18px}.grid{grid-template-columns:repeat(2,1fr)}} </style><div class="layout"><aside class="side"><h1>投资学习系统</h1><p class="muted">模拟交易 · 投资研究</p><a class="nav" href="/app.html">首页</a><a class="nav active" href="/portfolio.html">账户与盈亏</a><a class="nav" href="/index.html">投资研究</a></aside><main class="main"><h2>模拟交易账户</h2><p class="muted">所有交易都是模拟的，不会连接真实券商。</p><div class="grid"><div class="stat">现金<b id="cash">-</b></div><div class="stat">持仓市值<b id="value">-</b></div><div class="stat">浮动盈亏<b id="pnl">-</b></div><div class="stat">收益率<b id="rate">-</b></div></div><section class="panel"><h3>下单</h3><input id="symbol" placeholder="股票代码，例如600519"><select id="side"><option value="buy">买入</option><option value="sell">卖出</option></select><input id="quantity" type="number" min="1" placeholder="数量"><input id="price" type="number" min="0" step="0.01" placeholder="价格，留空用现价"><button id="order">提交模拟订单</button><span id="msg" class="muted"></span></section><section class="panel"><h3>当前持仓</h3><table><thead><tr><th>代码</th><th>数量</th><th>成本价</th><th>现价</th><th>市值</th><th>浮动盈亏</th></tr></thead><tbody id="positions"></tbody></table></section><section class="panel"><h3>最近交易</h3><table><thead><tr><th>时间</th><th>代码</th><th>方向</th><th>数量</th><th>价格</th><th>金额</th></tr></thead><tbody id="trades"></tbody></table></section></main></div><script>const money=n=>Number(n||0).toFixed(2);async function refresh(){const r=await fetch('/api/portfolio');const d=await r.json();cash.textContent=money(d.cash);value.textContent=money(d.marketValue);pnl.textContent=money(d.unrealizedPnl);rate.textContent=money(d.returnPct)+'%';positions.innerHTML=(d.positions||[]).map(x=>`<tr><td>${x.symbol}</td><td>${x.quantity}</td><td>${money(x.costPrice)}</td><td>${money(x.currentPrice)}</td><td>${money(x.marketValue)}</td><td>${money(x.unrealizedPnl)}</td></tr>`).join('')||'<tr><td colspan="6">暂无持仓</td></tr>';const account=await fetch('/api/account').then(r=>r.json());trades.innerHTML=(account.trades||[]).slice(0,20).map(x=>`<tr><td>${new Date(x.time).toLocaleString()}</td><td>${x.symbol}</td><td>${x.side==='buy'?'买入':'卖出'}</td><td>${x.quantity}</td><td>${money(x.price)}</td><td>${money(x.amount)}</td></tr>`).join('')||'<tr><td colspan="6">暂无交易</td></tr>';}order.onclick=async()=>{msg.textContent='提交中…';try{const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({symbol:symbol.value,side:side.value,quantity:quantity.value,price:price.value})});const d=await r.json();if(!r.ok)throw new Error(d.error);msg.textContent='订单已完成';await refresh();}catch(e){msg.textContent='失败：'+e.message}};refresh();setInterval(refresh,30000);</script></html>
