<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>行情中心 · 投资学习系统</title><link rel="stylesheet" href="/app.css"><style>body{margin:0;background:#f4f6fa;color:#17233a;font:14px Segoe UI,sans-serif}.app{display:flex;min-height:100vh}.side{width:238px;background:#101a2d;color:#dce6fb;padding:25px 16px}.brand{font-size:19px;font-weight:800;padding:0 12px 25px}.brand small{display:block;color:#8292b2;font-size:12px;margin-top:5px}.nav{display:block;color:#9eacc6;text-decoration:none;padding:11px 13px;border-radius:8px;margin:4px 0}.nav.active,.nav:hover{color:#fff;background:#263a64}.main{flex:1;max-width:1240px;padding:28px 34px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.head h1{margin:0;font-size:25px}.head p{color:#75839b}.panel{background:#fff;border:1px solid #e4e9f2;border-radius:12px;padding:18px;box-shadow:0 5px 15px #192b4310}.toolbar{display:flex;gap:8px;margin-bottom:15px}.toolbar input{flex:1;padding:11px;border:1px solid #dce3ee;border-radius:8px}.toolbar button{border:0;border-radius:8px;background:#1f69d8;color:#fff;padding:10px 16px;font-weight:700}.watch{width:100%;border-collapse:collapse}.watch th{font-size:11px;color:#8390a4;text-align:left;padding:10px;border-bottom:1px solid #e7ebf2}.watch td{padding:13px 10px;border-bottom:1px solid #edf0f5}.watch tr:hover{background:#f4f7fc;cursor:pointer}.up{color:#138b59}.down{color:#d24e58}.muted{color:#75839b}.empty{text-align:center;padding:35px;color:#8290a7}</style><div class="app"><aside class="side"><div class="brand">投资学习系统<small>真实行情 · 模拟交易</small></div><a class="nav" href="/trading.html">账户总览</a><a class="nav active" href="/market.html">行情中心</a><a class="nav" href="/settings.html">数据源设置</a><a class="nav" href="/index.html">Agent 研究</a><a class="nav" href="/index.html#card-form">决策卡片</a><a class="nav" href="/index.html#evaluation">复盘评测</a></aside><main class="main"><div class="head"><div><h1>行情中心</h1><p>公开市场实时行情 · 模拟交易环境</p></div><span class="muted" id="updated">未更新</span></div><section class="panel"><div class="toolbar"><input id="input" placeholder="输入 A 股代码，例如 600519"><button id="add">加入自选</button><button id="refresh">刷新全部</button></div><table class="watch"><thead><tr><th>代码</th><th>名称</th><th>最新价</th><th>涨跌</th><th>成交量</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></section></main></div><script>const key='watchlist_v1';let list=JSON.parse(localStorage.getItem(key)||'["600519","000001","300750"]');const money=n=>(Number(n||0)/100).toFixed(2);async function refresh(){const rows=document.getElementById('rows');rows.innerHTML='<tr><td colspan="6" class="empty">正在读取行情…</td></tr>';const data=await Promise.all(list.map(async symbol=>{try{const r=await fetch('/api/quote?symbol='+encodeURIComponent(symbol));return await r.json()}catch{return {error:true,f57:symbol}}}));rows.innerHTML=data.map(x=>{if(x.error||x.f58===undefined)return `<tr><td>${x.f57}</td><td colspan="5" class="down">读取失败</td></tr>`;const pct=Number(x.f170)/100;return `<tr><td><b>${x.f57}</b></td><td>${x.f58}</td><td>${money(x.f43)}</td><td class="${pct>=0?'up':'down'}">${pct>=0?'+':''}${pct.toFixed(2)}%</td><td>${x.f47||'-'}</td><td><button data-symbol="${x.f57}">研究 / 交易</button></td></tr>`}).join('');document.getElementById('updated').textContent='更新于 '+new Date().toLocaleTimeString();}document.getElementById('add').onclick=()=>{const v=document.getElementById('input').value.trim();if(v&&!list.includes(v)){list.push(v);localStorage.setItem(key,JSON.stringify(list));refresh()}document.getElementById('input').value=''};document.getElementById('refresh').onclick=refresh;document.getElementById('rows').onclick=e=>{const s=e.target.dataset.symbol;if(s)location.href='/stock.html?symbol='+s};refresh();setInterval(refresh,30000)</script></html>
