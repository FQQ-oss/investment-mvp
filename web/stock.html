<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个股详情 · 投资学习系统</title><style>body{margin:0;background:#f4f6fa;color:#17233a;font:14px Segoe UI,sans-serif}.main{max-width:1200px;margin:auto;padding:26px}.top{display:flex;justify-content:space-between;align-items:center}.muted{color:#74829a}.panel{background:#fff;border:1px solid #e1e7f0;border-radius:12px;padding:18px;margin-top:16px;box-shadow:0 5px 18px #10233d12}.price{font-size:30px;font-weight:800}.up{color:#168b59}.down{color:#d24e58}.chart{height:360px}.chart svg{width:100%;height:100%}.toolbar button{padding:8px 12px;margin-right:6px;border:1px solid #d7dfec;background:#fff;border-radius:7px}.toolbar button.active{background:#1f69d8;color:#fff}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.stat{background:#f7f9fc;border-radius:8px;padding:12px}.stat span{display:block;color:#7c8aa0;font-size:12px}.stat b{display:block;margin-top:6px;font-size:17px}@media(max-width:700px){.main{padding:14px}.stats{grid-template-columns:repeat(2,1fr)}} </style><main class="main"><div class="top"><div><h1 id="name">个股详情</h1><p class="muted" id="meta">正在加载</p></div><a href="/market.html">返回行情中心</a></div><section class="panel"><div class="price" id="price">--</div><div id="change" class="muted">--</div></section><section class="panel"><div class="toolbar"><button data-days="60" class="active">日线</button><button data-days="260">长期</button></div><div class="chart"><svg id="chart" viewBox="0 0 1000 360" preserveAspectRatio="none"></svg></div></section><section class="panel"><div class="stats"><div class="stat"><span>最新价</span><b id="s1">--</b></div><div class="stat"><span>今日最高</span><b id="s2">--</b></div><div class="stat"><span>今日最低</span><b id="s3">--</b></div><div class="stat"><span>成交量</span><b id="s4">--</b></div><div class="stat"><span>数据时间</span><b id="s5">--</b></div></div></section></main><script>const symbol=new URLSearchParams(location.search).get('symbol')||'600519';const money=n=>(Number(n||0)/100).toFixed(2);async function load(){const q=await fetch('/api/quote?symbol='+symbol).then(r=>r.json());name.textContent=`${q.f58||symbol}（${symbol}）`;price.textContent=money(q.f43);const pct=Number(q.f170)/100;change.textContent=`${pct>=0?'+':''}${pct.toFixed(2)}% · 数据源公开行情`;change.className=pct>=0?'up':'down';s1.textContent=money(q.f43);s2.textContent=money(q.f44);s3.textContent=money(q.f45);s4.textContent=q.f47||'--';s5.textContent=new Date().toLocaleString();const h=await fetch('/api/history?symbol='+symbol).then(r=>r.json());const rows=(h.klines||[]).slice(-60).map(x=>{const p=String(x).split(',');return {date:p[0],close:Number(p[2]||p[4])}}).filter(x=>x.close);if(!rows.length){chart.innerHTML='<text x="30" y="180" fill="#7c8aa0">暂无历史 K 线，请配置历史行情数据源</text>';return}const min=Math.min(...rows.map(x=>x.close)),max=Math.max(...rows.map(x=>x.close));const points=rows.map((x,i)=>`${i/(rows.length-1)*980+10},${340-(x.close-min)/(max-min||1)*300}`).join(' ');chart.innerHTML=`<polyline points="${points}" fill="none" stroke="#1f69d8" stroke-width="3"/><line x1="10" y1="340" x2="990" y2="340" stroke="#e5eaf2"/>`;};load().catch(e=>{meta.textContent='行情读取失败：'+e.message});</script></html>
