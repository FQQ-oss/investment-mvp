<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账户总览 · 投资学习系统</title><link rel="stylesheet" href="/app.css"><style>
body{margin:0;background:#f4f6fa;color:#17233a;font:14px Inter,Segoe UI,sans-serif}.app{display:flex;min-height:100vh}.side{width:238px;background:#101a2d;color:#dce6fb;padding:25px 16px}.brand{font-size:19px;font-weight:800;padding:0 12px 25px}.brand small{display:block;color:#8292b2;font-size:12px;font-weight:500;margin-top:5px}.nav{display:block;color:#9eacc6;text-decoration:none;padding:11px 13px;border-radius:8px;margin:4px 0}.nav.active,.nav:hover{color:#fff;background:#263a64}.main{flex:1;padding:28px 34px;max-width:1240px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top h1{font-size:25px;margin:0}.top p{color:#75839b;margin:5px 0 0}.badge{background:#e8f7ef;color:#168451;padding:7px 11px;border-radius:999px;font-weight:700;font-size:12px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.metric{background:#fff;border:1px solid #e4e9f2;border-radius:12px;padding:17px;box-shadow:0 5px 15px #192b4310}.metric span{color:#77859b;font-size:12px}.metric strong{display:block;font-size:23px;margin-top:10px;color:#15233b}.metric .up{color:#15915d;font-size:13px;margin-top:6px}.workspace{display:grid;grid-template-columns:1fr 330px;gap:16px;margin-top:16px}.panel{background:#fff;border:1px solid #e4e9f2;border-radius:12px;padding:18px;box-shadow:0 5px 15px #192b4310}.panel h2{font-size:16px;margin:0 0 15px}.chart{height:210px;background:linear-gradient(#fff,#fbfcff);border-radius:9px;position:relative;overflow:hidden}.chart svg{width:100%;height:100%}.chart-label{color:#8190a5;font-size:11px;display:flex;justify-content:space-between;margin-top:8px}.order-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.order-grid label{font-size:12px;color:#78869b}.order-grid input,.order-grid select{width:100%;margin-top:5px;padding:10px;border:1px solid #dce3ee;border-radius:7px;background:#fbfcff;color:#17233a}.wide{grid-column:1/-1}.primary{width:100%;border:0;background:#1f69d8;color:#fff;padding:11px;border-radius:7px;font-weight:700;cursor:pointer}.primary:hover{background:#185abc}.positions{margin-top:16px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11px;color:#8390a4;padding:10px;border-bottom:1px solid #e7ebf2}td{padding:12px 10px;border-bottom:1px solid #edf0f5;color:#263650}td strong{color:#16243a}.positive{color:#138b59!important}.negative{color:#d24e58!important}.notice{background:#fff8e7;border:1px solid #f2dfaa;color:#7f6220;border-radius:8px;padding:11px;font-size:12px;margin-top:14px}@media(max-width:900px){.side{width:190px}.main{padding:20px}.metrics{grid-template-columns:repeat(2,1fr)}.workspace{grid-template-columns:1fr}}@media(max-width:560px){.app{display:block}.side{width:auto}.metrics{grid-template-columns:1fr 1fr}.main{padding:14px}}
</style><div class="app"><aside class="side"><div class="brand">投资学习系统<small>模拟交易 · 投资研究</small></div><a class="nav active" href="/trading.html">账户总览</a><a class="nav" href="/settings.html">数据源设置</a><a class="nav" href="/index.html">投资研究</a></aside><main class="main"><div class="top"><div><h1>账户总览</h1><p>模拟账户 · 实时行情 · 仅用于学习</p></div><span class="badge">模拟交易</span></div><div class="metrics"><div class="metric"><span>账户总资产</span><strong id="total">--</strong><div class="up" id="totalChange">等待数据</div></div><div class="metric"><span>现金余额</span><strong id="cash">--</strong><div class="up">可用资金</div></div><div class="metric"><span>持仓市值</span><strong id="value">--</strong><div class="up">按最新行情</div></div><div class="metric"><span>浮动盈亏</span><strong id="pnl">--</strong><div class="up" id="rate">--</div></div></div><div class="workspace"><section><div class="panel"><h2>资产表现</h2><div class="chart"><svg viewBox="0 0 800 210" preserveAspectRatio="none"><path d="M0 178 C80 174 105 140 170 155 S270 112 330 132 S410 78 475 102 S570 62 625 78 S710 40 800 52" fill="none" stroke="#286ed7" stroke-width="3"/><path d="M0 178 C80 174 105 140 170 155 S270 112 330 132 S410 78 475 102 S570 62 625 78 S710 40 800 52 L800 210 L0 210Z" fill="#286ed7" opacity=".08"/></svg></div><div class="chart-label"><span>近 60 个交易日</span><span>实时模拟估值</span></div></div><div class="panel positions"><h2>当前持仓</h2><div class="table-wrap"><table><thead><tr><th>标的</th><th>数量</th><th>成本价</th><th>现价</th><th>市值</th><th>盈亏</th></tr></thead><tbody id="positions"><tr><td colspan="6">正在加载</td></tr></tbody></table></div></div></section><aside><div class="panel"><h2>模拟下单</h2><div class="order-grid"><label>股票代码<input id="symbol" placeholder="600519"></label><label>方向<select id="side"><option value="buy">买入</option><option value="sell">卖出</option></select></label><label>数量<input id="quantity" type="number" min="1" placeholder="100"></label><label>价格<input id="price" type="number" step=".01" placeholder="市价"></label><div class="wide"><button class="primary" id="order">提交模拟订单</button></div></div><p class="muted" id="msg"></p></div><div class="notice">这是模拟账户。真实交易前，请先通过长期回测和纸上交易验证策略。</div></aside></div><div class="panel positions"><h2>最近交易</h2><div class="table-wrap"><table><thead><tr><th>时间</th><th>标的</th><th>方向</th><th>数量</th><th>价格</th><th>金额</th></tr></thead><tbody id="trades"><tr><td colspan="6">暂无交易</td></tr></tbody></table></div></div></main></div><script>const money=n=>Number(n||0).toFixed(2);async function refresh(){try{const d=await fetch('/api/portfolio').then(r=>r.json());total.textContent=money(Number(d.cash||0)+Number(d.marketValue||0));cash.textContent=money(d.cash);value.textContent=money(d.marketValue);pnl.textContent=money(d.unrealizedPnl);rate.textContent=money(d.returnPct)+'%';totalChange.textContent='模拟账户总览';positions.innerHTML=(d.positions||[]).map(x=>`<tr><td><strong>${x.symbol}</strong></td><td>${x.quantity}</td><td>${money(x.costPrice)}</td><td>${money(x.currentPrice)}</td><td>${money(x.marketValue)}</td><td class="${x.unrealizedPnl>=0?'positive':'negative'}">${money(x.unrealizedPnl)}</td></tr>`).join('')||'<tr><td colspan="6">暂无持仓</td></tr>';const a=await fetch('/api/account').then(r=>r.json());trades.innerHTML=(a.trades||[]).slice(0,20).map(x=>`<tr><td>${new Date(x.time).toLocaleString()}</td><td>${x.symbol}</td><td>${x.side==='buy'?'买入':'卖出'}</td><td>${x.quantity}</td><td>${money(x.price)}</td><td>${money(x.amount)}</td></tr>`).join('')||'<tr><td colspan="6">暂无交易</td></tr>'}catch(e){msg.textContent='账户数据加载失败：'+e.message}}order.onclick=async()=>{msg.textContent='提交中…';try{const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({symbol:symbol.value,side:side.value,quantity:quantity.value,price:price.value})});const d=await r.json();if(!r.ok)throw Error(d.error);msg.textContent='模拟订单已完成';await refresh()}catch(e){msg.textContent='提交失败：'+e.message}};refresh();setInterval(refresh,30000)</script></html>
