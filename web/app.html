<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/app.css"><title>投资学习系统</title><style>body{margin:0;background:#0b1020;color:#edf2ff;font:15px Segoe UI,sans-serif}.layout{display:flex;min-height:100vh}.side{width:230px;background:#10182b;border-right:1px solid #263250;padding:24px}.side h1{font-size:20px}.nav{display:block;color:#b6c2df;text-decoration:none;padding:11px;border-radius:8px;margin:6px 0}.nav:hover,.nav.active{background:#24365e;color:#fff}.main{max-width:1100px;padding:34px;flex:1}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.stat{background:#121a2f;border:1px solid #263250;border-radius:12px;padding:18px}.stat b{font-size:25px;display:block;margin-top:8px}.panel{background:#121a2f;border:1px solid #263250;border-radius:12px;padding:20px;margin-top:18px}.muted{color:#9aa8c7}@media(max-width:750px){.side{width:170px}.main{padding:18px}.grid{grid-template-columns:1fr}}</style><div class="layout"><aside class="side"><h1>投资学习系统</h1><p class="muted">模拟交易 · Agent 研究 · 复盘</p><a class="nav active" href="/app.html">首页</a><a class="nav" href="/settings.html">数据源设置</a><a class="nav" href="/trading.html">账户与盈亏</a><a class="nav" href="/index.html">行情研究</a><a class="nav" href="/index.html#card-form">决策卡片</a><a class="nav" href="/index.html#evaluation">评测中心</a></aside><main class="main"><h2>账户总览</h2><p class="muted">这里是登录后的应用首页。所有操作都围绕模拟账户、研究和复盘展开。</p><div class="grid"><div class="stat">账户模式<b id="mode">加载中</b></div><div class="stat">持仓市值<b id="value">加载中</b></div><div class="stat">浮动盈亏<b id="pnl">加载中</b></div></div><section class="panel"><h3>开始使用</h3><p>先到“账户与盈亏”导入持仓或创建新手账户，再到“行情研究”让 Agent 分析股票，最后把分析保存成决策卡片。</p><a class="nav active" href="/trading.html">打开账户看板</a></section></main></div><script>fetch('/api/portfolio').then(r=>r.json()).then(d=>{mode.textContent=d.mode==='experienced'?'已有账户':'新手模拟';value.textContent=(d.marketValue||0).toFixed(2)+' 元';pnl.textContent=(d.unrealizedPnl||0).toFixed(2)+' 元'}).catch(()=>{mode.textContent='未加载'})</script></html>
