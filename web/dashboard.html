<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>投资学习系统</title><style>body{margin:0;background:#f4f6fa;color:#17233a;font:14px Segoe UI,sans-serif}.app{display:flex;min-height:100vh}.side{width:230px;background:#101a2d;color:#e5ecfb;padding:24px 16px}.brand{font-size:19px;font-weight:800;padding:0 12px 26px}.brand small{display:block;font-size:12px;color:#8493b0;margin-top:5px}.nav{display:block;color:#a6b4cb;text-decoration:none;padding:11px 13px;border-radius:8px;margin:5px 0}.nav.active,.nav:hover{background:#294477;color:#fff}.main{flex:1;max-width:1200px;padding:32px}.head{display:flex;justify-content:space-between;align-items:center}.head h1{margin:0;font-size:28px}.muted{color:#74829a}.status{background:#e7f7ee;color:#168451;padding:7px 11px;border-radius:99px;font-weight:700}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:24px}.card,.module{background:#fff;border:1px solid #e3e8f1;border-radius:12px;padding:18px;box-shadow:0 5px 16px #14233a10}.card span{color:#7b899e;font-size:12px}.card b{display:block;font-size:24px;margin-top:9px}.modules{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.module a{display:inline-block;margin-top:14px;color:#1f69d8;text-decoration:none;font-weight:700}.module h3{margin:0 0 7px}@media(max-width:800px){.side{width:180px}.main{padding:18px}.cards,.modules{grid-template-columns:1fr 1fr}}@media(max-width:560px){.app{display:block}.side{width:auto}.cards,.modules{grid-template-columns:1fr}}</style><div class="app"><aside class="side"><div class="brand">投资学习系统<small>模拟交易 · 投资研究</small></div><a class="nav active" href="/dashboard.html">账户总览</a><a class="nav" href="/market.html">行情中心</a><a class="nav" href="/trading.html">模拟交易</a><a class="nav" href="/index.html">投资研究</a><a class="nav" href="/settings.html">数据源设置</a></aside><main class="main"><div class="head"><div><h1>账户总览</h1><p class="muted">真实行情，虚拟资金，记录每一次决策。</p></div><span class="status">模拟模式</span></div><div class="cards"><div class="card"><span>账户现金</span><b id="cash">--</b></div><div class="card"><span>持仓市值</span><b id="value">--</b></div><div class="card"><span>浮动盈亏</span><b id="pnl">--</b></div><div class="card"><span>收益率</span><b id="rate">--</b></div></div><div class="modules"><div class="module"><h3>行情中心</h3><p class="muted">查看自选股、实时价格和个股详情。</p><a href="/market.html">进入行情 →</a></div><div class="module"><h3>模拟交易</h3><p class="muted">提交模拟委托，管理持仓和成交记录。</p><a href="/trading.html">进入交易 →</a></div><div class="module"><h3>投资研究</h3><p class="muted">分析交易理由，保存研究记录和风险。</p><a href="/index.html">开始研究 →</a></div></div></main></div><script>(async()=>{const me=await fetch('/api/auth/me').then(r=>r.json());if(!me.authenticated){location.href='/login.html';return}const d=await fetch('/api/portfolio').then(r=>r.json());cash.textContent=d.unlimitedCash?'无限':Number(d.cash||0).toFixed(2);value.textContent=Number(d.marketValue||0).toFixed(2);pnl.textContent=Number(d.unrealizedPnl||0).toFixed(2);rate.textContent=Number(d.returnPct||0).toFixed(2)+'%'})().catch(()=>location.href='/login.html');</script></html>
