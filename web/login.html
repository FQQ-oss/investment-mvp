<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 - 投资学习系统</title><style>body{font:15px Segoe UI;background:#0b1020;color:#edf2ff;max-width:420px;margin:70px auto;padding:20px}main{background:#121a2f;border:1px solid #263250;border-radius:14px;padding:22px}input{width:100%;box-sizing:border-box;margin:7px 0 14px;padding:11px;border-radius:8px;background:#0c1326;color:#fff;border:1px solid #263250}button{padding:10px 14px;border:0;border-radius:8px;background:#7c9cff;font-weight:700;margin-right:8px}.muted{color:#9aa8c7}</style><main><h1>投资学习系统</h1><p class="muted">本地模拟账户登录，不连接真实券商。</p><label>用户名</label><input id="u"><label>密码</label><input id="p" type="password"><button id="login">登录</button><button id="register">注册</button><p id="msg" class="muted"></p></main><script>async function send(path){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});const d=await r.json();msg.textContent=d.error||'成功';if(r.ok&&path.endsWith('login'))location.href='/dashboard.html'}login.onclick=()=>send('/api/auth/login');register.onclick=()=>send('/api/auth/register');</script></html>
