<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数据源设置</title><style>body{font:15px Segoe UI;background:#f4f6fa;color:#17233a;max-width:650px;margin:50px auto;padding:20px}.panel{background:#fff;border:1px solid #e1e7f0;border-radius:12px;padding:24px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd6e5;border-radius:8px;margin:10px 0 16px}button{background:#1f69d8;color:white;border:0;border-radius:8px;padding:11px 16px;font-weight:700}.muted{color:#74829a}#msg{margin-top:15px}</style><div class="panel"><h1>数据源设置</h1><p class="muted">填写你自己的 Tushare Token。Token 只用于本地服务请求，不会写进源码。</p><label>Tushare Token</label><input id="token" type="password" autocomplete="off" placeholder="粘贴你的 Token"><button id="save">保存并测试</button><p id="msg" class="muted"></p><p><a href="/app.html">返回应用首页</a></p></div><script>save.onclick=async()=>{msg.textContent='正在保存…';const r=await fetch('/api/settings/tushare',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token.value})});const d=await r.json();msg.textContent=r.ok?'已保存。请到行情中心验证。':(d.error||'保存失败');if(r.ok)token.value=''};</script></html>
